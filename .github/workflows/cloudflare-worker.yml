name: Cloudflare Worker Tests

on:
  push:
    branches:
      - chore/spark-free-worker-migration
    paths:
      - "cloudflare/attachments-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare/attachments-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Cloudflare Worker toolchain
        working-directory: cloudflare/attachments-worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Cloudflare Worker unit tests
        working-directory: cloudflare/attachments-worker
        run: npm test
      - name: Run local Worker smoke check
        working-directory: cloudflare/attachments-worker
        run: npm run smoke
      - name: Check deployed Worker smoke script syntax
        working-directory: cloudflare/attachments-worker
        run: node --check scripts/smoke-deployed-worker.mjs
      - name: Run Worker deployment preflight
        working-directory: cloudflare/attachments-worker
        run: npm run predeploy
      - name: Validate Worker bundle and wrangler configuration
        working-directory: cloudflare/attachments-worker
        run: npx wrangler deploy --dry-run
