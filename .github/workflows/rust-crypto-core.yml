name: Rust crypto core

on:
  push:
    paths:
      - "rust/inchat-crypto-core/**"
      - ".github/workflows/rust-crypto-core.yml"
  pull_request:
    paths:
      - "rust/inchat-crypto-core/**"
      - ".github/workflows/rust-crypto-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test isolated Rust crypto core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - name: Check formatting
        run: rustfmt --check --edition 2021 rust/inchat-crypto-core/src/megolm.rs

      - name: Run tests
        run: cargo test --manifest-path rust/inchat-crypto-core/Cargo.toml
