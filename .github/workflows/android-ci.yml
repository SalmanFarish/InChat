name: Android CI

on:
  push:
    branches:
      - chore/spark-free-worker-migration
    paths:
      - "app/**"
      - "rust/inchat-crypto-core/**"
      - "cloudflare/attachments-worker/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "rust/inchat-crypto-core/**"
      - "cloudflare/attachments-worker/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build APK and run JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android 17 preview platform and NDK
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: |
          rustup target add \
            armv7-linux-androideabi \
            aarch64-linux-android \
            i686-linux-android \
            x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests and assemble debug APK
        run: bash ./gradlew --no-daemon --stacktrace clean :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug

      - name: Run encrypted messaging integration tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu off -no-snapshot
          disable-animations: true
          script: bash ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.inchat.crypto.EncryptedDirectPendingMessageRepositoryTest,com.example.inchat.crypto.OlmSenderRecipientRecoveryIntegrationTest,com.example.inchat.crypto.FirebaseOlmInboxReceiverTest,com.example.inchat.crypto.OlmOutboundDeliveryCoordinatorTest,com.example.inchat.crypto.OlmDeliveryQueueTest,com.example.inchat.crypto.OlmDeliveryWorkerRunnerTest,com.example.inchat.crypto.RoomOlmDirectMessageCommitAtomicityTest,com.example.inchat.crypto.RoomOlmDeliveryQueueStoreTest,com.example.inchat.crypto.OlmDeliveryReceiptDaoTest,com.example.inchat.crypto.OlmDeliveryAckProcessorTest,com.example.inchat.crypto.EncryptedGroupOutgoingCommitIntegrityTest,com.example.inchat.crypto.RoomOlmGroupMessageCommitAtomicityTest,com.example.inchat.crypto.OlmGroupKeyDistributionReadinessTest,com.example.inchat.crypto.OlmSessionRepositoryTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  cloudflare-worker:
    name: Cloudflare encrypted relay and acknowledgement tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Cloudflare Worker test suite
        working-directory: cloudflare/attachments-worker
        run: npm test

      - name: Validate free-tier-safe Worker configuration
        working-directory: cloudflare/attachments-worker
        run: npm run predeploy
